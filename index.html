<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CodeMentor — Automated Code Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1521; --panel: #171f2e; --panel-2: #1d2637; --ink: #e8ecf1;
    --ink-dim: #9aa7bb; --line: #2a3547; --teal: #4fd1c5; --amber: #f5a623; --red: #f16565;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Space Grotesk", sans-serif; }
  header { padding: 20px 28px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 0; font-size: 12px; color: var(--ink-dim); font-family: "JetBrains Mono", monospace; }
  main { display: grid; grid-template-columns: 260px 1fr 320px; gap: 20px; padding: 24px 28px; }
  @media (max-width: 950px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .problem-btn { display: block; width: 100%; text-align: left; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--ink); padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-family: inherit; font-size: 13px; }
  .problem-btn.active { border-color: var(--teal); color: var(--teal); }
  .diff-tag { font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--ink-dim); }
  textarea { width: 100%; height: 320px; background: #0b1019; color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 14px; font-family: "JetBrains Mono", monospace; font-size: 13px; resize: vertical; }
  #prompt { font-size: 13px; line-height: 1.6; color: var(--ink-dim); white-space: pre-wrap; margin-bottom: 14px; }
  button.run { background: var(--teal); color: #0f1521; border: none; padding: 10px 20px; border-radius: 8px;
    font-weight: 600; cursor: pointer; margin-top: 12px; font-family: inherit; }
  .result-row { font-family: "JetBrains Mono", monospace; font-size: 12.5px; padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; }
  .result-row.pass { background: #14251f; color: var(--amber); border: 1px solid #2c4a3a; }
  .result-row.fail { background: #2a1414; color: var(--red); border: 1px solid #4a2c2c; }
  .hint-box { background: #241d0e; border: 1px solid #4a3a1c; color: var(--amber); border-radius: 8px; padding: 12px 14px; font-size: 13px; margin-top: 14px; }
  .feedback-box { background: #14251f; border: 1px solid #2c4a3a; color: var(--teal); border-radius: 8px; padding: 12px 14px; font-size: 13px; margin-top: 14px; }
  .score-line { font-family: "JetBrains Mono", monospace; font-size: 13px; margin-bottom: 10px; color: var(--ink-dim); }
</style>
</head>
<body>
<header>
  <div>
    <h1>CodeMentor</h1>
    <p>automated review + progressive hints</p>
  </div>
  <div class="diff-tag" id="attemptLabel">attempt 0</div>
</header>

<main>
  <aside class="panel">
    <h3 style="margin-top:0;font-size:13px;text-transform:uppercase;color:var(--ink-dim);">Problems</h3>
    <div id="problemList"></div>
  </aside>

  <section class="panel">
    <div id="prompt">Select a problem to begin.</div>
    <textarea id="codeInput" spellcheck="false" placeholder="def two_sum(nums, target):\n    pass"></textarea>
    <button class="run" id="btnRun">Run against test cases</button>
  </section>

  <aside class="panel">
    <div class="score-line" id="scoreLine">0 / 0 test cases passed</div>
    <div id="resultsList"></div>
    <div id="hintBox"></div>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
